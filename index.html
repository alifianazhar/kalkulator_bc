<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Balance Cairan</title>
    <style>
        :root {
            --primary-med: #0077b6; /* Biru Medis */
            --secondary-med: #00b4d8;
            --accent-green: #2a9d8f;
            --bg-light: #f8f9fa;
            --border-color: #dee2e6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-light); 
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background-color: var(--primary-med);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.9; }

        .form-section { padding: 20px; }

        .shift-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 5px;
            border-radius: 8px;
        }

        .shift-selector label {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .shift-selector input[type="radio"] { display: none; }
        
        .shift-selector input[type="radio"]:checked + span {
            background: var(--primary-med);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            display: block;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label.group-title { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #555;
            margin-bottom: 5px;
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-row div { flex: 1; }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="number"]:focus { border-color: var(--secondary-med); box-shadow: 0 0 5px rgba(0,180,216,0.3); }

        .checkbox-wrapper {
            margin-top: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .checkbox-wrapper label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #444;
            cursor: pointer;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { background-color: #21867a; }

        .result-card {
            margin-top: 20px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px dashed var(--primary-med);
            border-radius: 8px;
            display: none;
        }

        .result-header {
            color: var(--primary-med);
            font-weight: bold;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
            padding-bottom: 5px;
        }

        .result-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-line;
            color: #333;
        }
      
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏥 KALKULATOR BALANCE CAIRAN</h2>
        <p>Aplikasi Monitoring Intake & Output Pasien</p>
    </div>

    <div class="form-section">
        <div class="shift-selector">
            <label>
                <input type="radio" name="dinas" value="Pagi" onclick="aturForm()">
                <span>PAGI</span>
            </label>
            <label>
                <input type="radio" name="dinas" value="Sore" onclick="aturForm()">
                <span>SORE</span>
            </label>
            <label>
                <input type="radio" name="dinas" value="Malam" onclick="aturForm()">
                <span>MALAM</span>
            </label>
        </div>

        <div id="shift-inputs">
            <div class="input-group">
                <label class="group-title">📥 INPUT (CC)</label>
                <div class="input-row">
                    <input type="number" id="minum" placeholder="Minum (🥛)">
                    <input type="number" id="infus" placeholder="Infus (💧)">
                    <input type="number" id="obat" placeholder="Obat (💉)">
                </div>
                
                <div class="checkbox-wrapper">
                    <label>
                        <input type="checkbox" id="cek_tranfusi" onchange="toggleVis('tranfusi_container', this.checked)"> 
                        + Ada Tranfusi?
                    </label>
                </div>
                <div class="input-row hidden" id="tranfusi_container">
                    <input type="number" id="tranfusi" placeholder="Jumlah Tranfusi (cc)">
                </div>
            </div>

            <div class="input-group">
                <label class="group-title">📤 OUTPUT (CC)</label>
                <div class="input-row">
                    <input type="number" id="urine" placeholder="Urine">
                </div>

                <div class="checkbox-wrapper">
                    <label>
                        <input type="checkbox" id="cek_drain" onchange="toggleVis('drain_container', this.checked)"> 
                        + Ada Drain?
                    </label>
                    <label>
                        <input type="checkbox" id="cek_NGT" onchange="toggleVis('NGT_container', this.checked)"> 
                        + Ada Produksi NGT?
                    </label>
                    <label>
                        <input type="checkbox" id="cek_BB" onchange="toggleVis('BB_container', this.checked)"> 
                        + IWL
                    </label>
                </div>
                
                <div class="input-row hidden" id="drain_container">
                    <input type="number" id="drain" placeholder="Isi Drain (cc)">
                </div>
                <div class="input-row hidden" id="NGT_container">
                    <input type="number" id="NGT" placeholder="Produksi NGT (cc)">
                </div>
                <div class="input-row hidden" id="BB_container">
                    <input type="number" id="BB" placeholder="Berat Badan (KG)">
                    <input type="number" id="suhu" placeholder="Suhu (℃)">
                </div>
            </div>
        </div>

        <div id="section-24jam" class="hidden">
            <div style="border-top: 2px solid #eee; margin: 20px 0; padding-top: 10px;">
                <label class="group-title" style="color: var(--primary-med);">📊 DATA AKUMULASI (PAGI & SORE)</label>
                <div class="input-group">
                    <label class="group-title">Shift Pagi</label>
                    <div class="input-row">
                        <input type="number" id="input_pagi" placeholder="Total In Pagi">
                        <input type="number" id="output_pagi" placeholder="Total Out Pagi">
                    </div>
                </div>
                <div class="input-group">
                    <label class="group-title">Shift Sore</label>
                    <div class="input-row">
                        <input type="number" id="input_sore" placeholder="Total In Sore">
                        <input type="number" id="output_sore" placeholder="Total Out Sore">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="hitungSemua()">✅ HITUNG BALANCE</button>

        <div id="box-hasil" class="result-card">
            <div class="result-header">📑 LAPORAN BALANCE CAIRAN</div>
            <div id="hasil-teks" class="result-text"></div>
        </div>
    </div>
</div>

<script>
    function aturForm() {
        const dinasObj = document.querySelector('input[name="dinas"]:checked');
        if (!dinasObj) return;

        const dinas = dinasObj.value;
        const section24 = document.getElementById("section-24jam");
        document.getElementById("box-hasil").style.display = "none";
        
        if (dinas === "Malam") {
            section24.classList.remove("hidden");
        } else {
            section24.classList.add("hidden");
        }
    }

    function toggleVis(idContainer, isChecked) {
        const container = document.getElementById(idContainer);
        if (isChecked) {
            container.classList.remove("hidden");
        } else {
            container.classList.add("hidden");
            container.querySelector('input').value = ""; 
        }
    }

    function hitungSemua() {
        const radioDinas = document.querySelector('input[name="dinas"]:checked');
        if (!radioDinas) { 
            alert("Silakan pilih shift dinas terlebih dahulu!"); 
            return; 
        }

        const dinas = radioDinas.value;
        const getVal = (id) => Number(document.getElementById(id).value) || 0;

        let jamDinas, durasi, jamAngka;
        if (dinas === "Pagi") { jamDinas = "07:00-14:00"; durasi = "7 jam"; jamAngka = 7; }
        else if (dinas === "Sore") { jamDinas = "14:00-21:00"; durasi = "7 jam"; jamAngka = 7; }
        else { jamDinas = "21:00-07:00"; durasi = "10 jam"; jamAngka = 10; }

        // Intake
        let minum = getVal("minum");
        let infus = getVal("infus");
        let obat = getVal("obat");
        let isTranfusi = document.getElementById("cek_tranfusi").checked;
        let tranfusi = isTranfusi ? getVal("tranfusi") : 0;
        let inShift = minum + infus + obat + tranfusi;

        // Output
        let urine = getVal("urine");
        let isDrain = document.getElementById("cek_drain").checked;
        let isNGT = document.getElementById("cek_NGT").checked;
        let isIWL = document.getElementById("cek_BB").checked;

        let drain = isDrain ? getVal("drain") : 0;
        let NGT = isNGT ? getVal("NGT") : 0;
        let BB = isIWL ? getVal("BB") : 0;
        let suhu =getVal("suhu");

        // Perhitungan IWL (15 * BB / 24 jam) * jam kerja
        let IWL = 0;
        if (isIWL && BB > 0) {
            IWL = (15 * BB / 24);
        }
        let IWLnormal = IWL * jamAngka;
        let IWLfloat = IWLnormal.toFixed(2);
        
        //perhitungan iwl dengan demam
        let IWLdemam = 0;
        if (suhu > 37) {
            IWLdemam = ((((10/100 * inShift) * (suhu-37) / 24) + IWL ) * jamAngka);
        }
        let IWLkenaikanSuhu = IWLdemam.toFixed(2);
        
        let IWLtotal = Number(IWLfloat) + Number(IWLkenaikanSuhu);
        
        let outShift = urine + drain + NGT + IWLtotal;
        let outShiftBulat = outShift.toFixed(2);
        let balanceShift = inShift - outShift;
        let balShift = balanceShift.toFixed(2);
        
        // Susun Teks Laporan
        let teks = `${jamDinas}\n`;
        
        let teksInput = `Input: Minum ${minum}cc + Infus ${infus}cc + Obat ${obat}cc`;
        if (isTranfusi) teksInput += ` + Tranfusi ${tranfusi}cc`;
        teksInput += ` = ${inShift}cc\n`;

        let teksOutput = `Output: Urine ${urine}cc`;
        if (isDrain) teksOutput += ` + Drain ${drain}cc`;
        if (isNGT) teksOutput += ` + NGT ${NGT}cc`;
        if (isIWL) teksOutput += ` + IWL ${IWLfloat}cc + suhu ${suhu} + IWL saat demam ${IWLkenaikanSuhu}`;
        teksOutput += ` = ${outShiftBulat}cc\n`;

        teks += teksInput + teksOutput;
        teks += `Balance Shift: ${balShift >= 0 ? '+' : ''}${balShift}cc / ${durasi}`;

        // Logika Akumulasi 24 Jam
        if (dinas === "Malam") {
            let inPagi = getVal("input_pagi");
            let outPagi = getVal("output_pagi");
            let inSore = getVal("input_sore");
            let outSore = getVal("output_sore");
            
            let totalIn = inPagi + inSore + inShift;
            let totalOut = outPagi + outSore + outShift;
            let balTotal = totalIn - totalOut;

            teks += `\n------------------------------\n`;
            teks += `Balance Cairan/24 JAM\n`;
            teks += `Total Input : ${inPagi} + ${inSore} + ${inShift} = ${totalIn} cc\n`;
            teks += `Total Output: ${outPagi} + ${outSore} + ${outShift} = ${totalOut} cc\n`;
            teks += `Balance Total: ${balTotal >= 0 ? '+' : ''}${balTotal} cc / 24 jam`;
        }

        const box = document.getElementById("box-hasil");
        document.getElementById("hasil-teks").innerText = teks;
        box.style.display = "block";
        box.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
